{# Автор (докладчик) со ссылкой на карточку человека кафедры. Параметр: author. #}{% with person=author.person %}{% if person %}<a href="{{ person.get_absolute_url }}">{{ author }}</a>{% if author.student_id %} <span class="badge text-bg-light border">курсант</span>{% elif author.adjunct_id %} <span class="badge text-bg-light border">адъюнкт</span>{% endif %}{% else %}{{ author }}{% endif %}{% endwith %}
