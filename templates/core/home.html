{% extends 'base.html' %}

{% block content %}
<div class="p-4 p-md-5 bg-white rounded-3 shadow-sm mb-4">
    <h1 class="h3 mb-3">Здравствуйте, {{ user.first_name|default:user.username }}!</h1>
    <p class="lead mb-0">Добро пожаловать в систему учёта показателей НИР кафедры.</p>
</div>

<div class="row g-3">
    {% for section in sections %}
        <div class="col-12 col-md-6 col-lg-4">
            <a href="{{ section.url }}" class="card h-100 text-decoration-none shadow-sm">
                <div class="card-body">
                    <h2 class="h5 card-title">{{ section.title }}</h2>
                    <p class="card-text text-muted mb-0">{{ section.text }}</p>
                </div>
            </a>
        </div>
    {% endfor %}
</div>
{% endblock %}
