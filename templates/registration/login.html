{% extends 'base.html' %}

{% block title %}Вход — Учёт показателей НИР кафедры{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm mt-md-5">
            <div class="card-body p-4">
                <h1 class="h4 mb-4 text-center">Вход в систему</h1>

                {% if form.non_field_errors %}
                    <div class="alert alert-danger" role="alert">Неверный логин или пароль.</div>
                {% endif %}

                <form method="post" novalidate>
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">Логин</label>
                        <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
                               class="form-control" value="{{ form.username.value|default:'' }}"
                               autocomplete="username" autofocus required>
                    </div>
                    <div class="mb-4">
                        <label for="{{ form.password.id_for_label }}" class="form-label">Пароль</label>
                        <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
                               class="form-control" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
